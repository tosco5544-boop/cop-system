<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>管理者ログイン | UMW 社内システム</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/assets/common.css">
</head>
<body data-portal="admin" class="admin-portal">
<div class="login-wrap">
  <form class="card login" id="login-form" autocomplete="on">
    <div class="brand-mark">UMW</div>
    <h1>社内システム</h1>
    <p class="sub">管理者ログイン</p>
    <label class="f"><span>社員ID</span><input class="inp" name="employee_code" autocomplete="username" autocapitalize="off" required></label>
    <label class="f"><span>パスワード</span><input class="inp" type="password" name="password" autocomplete="current-password" required></label>
    <div class="err" id="err" style="margin-bottom:10px"></div>
    <button class="btn pri block" type="submit">管理者としてログイン</button>
    <p class="hint" style="margin:14px 0 0">施設長・本部の管理者がログインします。</p>
    <p class="hint" style="text-align:center"><a href="/office/login.html">事務員の方はこちら</a></p>
  </form>
</div>
<div id="toast"></div>
<script src="/assets/common.js"></script>
<script src="/assets/login.js"></script>
</body>
</html>
